[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whoolib"
version = "1.0.0"
description = "Unofficial Python client for the whoo mobile API (reconstructed from app.whoo 0.140.0)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "whoolib contributors" }]
keywords = ["whoo", "api", "client", "reverse-engineering"]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["whoolib*"]

[tool.setuptools.package-data]
whoolib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
